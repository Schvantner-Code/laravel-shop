                                type: integer
                                example: 1
                              name:
                                type: string
                                example: Notebook
                              quantity:
                                type: integer
                                example: 2
                              unit_price:
                                type: string
                                example: '12.50'
                              total:
                                type: string
                                example: '25.00'
