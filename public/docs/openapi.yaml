            application/json:
              schema:
                type: object
                example:
                  error:
                    code: unauthenticated
                    message: 'Authentication is required.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: unauthenticated
                      message:
                        type: string
                        example: 'Authentication is required.'
        403:
          description: 'Administrator access is required.'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: forbidden
                    message: 'You are not authorized to perform this action.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: forbidden
                      message:
                        type: string
                        example: 'You are not authorized to perform this action.'
        404:
          description: 'The order was not found.'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: resource_not_found
                    message: 'The requested resource was not found.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: resource_not_found
                      message:
                        type: string
                        example: 'The requested resource was not found.'
        409:
          description: 'The requested status transition is not allowed.'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: invalid_order_transition
                    message: 'Invalid transition from pending to paid for this payment method.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: invalid_order_transition
                      message:
                        type: string
                        example: 'Invalid transition from pending to paid for this payment method.'
        422:
          description: 'The status value is invalid.'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: validation_failed
                    message: 'The request data is invalid.'
                    details:
                      field:
                        - 'The field is required.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: validation_failed
                      message:
                        type: string
                        example: 'The request data is invalid.'
                      details:
                        type: object
                        properties:
                          field:
                            type: array
                            example:
                              - 'The field is required.'
                            items:
                              type: string
      tags:
        - 'Admin Management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'The new status (paid, shipped, completed, cancelled).'
                  example: paid
              required:
                - status
    parameters:
      -
        in: path
        name: order_id
        description: 'The ID of the order.'
        example: 16
        required: true
        schema:
          type: integer
