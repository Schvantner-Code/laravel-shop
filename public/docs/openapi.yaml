  '/api/v1/admin/orders/{order_id}/status':
    patch:
      summary: 'Update Order Status'
      operationId: updateOrderStatus
      description: 'Transition the order to a new status (e.g. pending -> paid).'
      parameters: []
      responses:
        200:
          description: 'Order status updated.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 1
                    status: Pending
                    status_code: pending
                    total_price: '25.00'
                    created_at: '2026-08-07T12:00:00+00:00'
                    items:
                      -
                        product_id: 1
                        name: Notebook
                        quantity: 2
                        unit_price: '12.50'
                        total: '25.00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: Pending
                      status_code:
                        type: string
                        example: pending
                      total_price:
                        type: string
                        example: '25.00'
                      created_at:
                        type: string
                        example: '2026-08-07T12:00:00+00:00'
                      items:
                        type: array
                        example:
                          - product_id: 1
                            name: Notebook
                            quantity: 2
                            unit_price: '12.50'
                            total: '25.00'
                        items:
                          type: object
                          properties:
                            product_id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: Notebook
                            quantity:
                              type: integer
                              example: 2
                            unit_price:
                              type: string
                              example: '12.50'
                            total:
                              type: string
                              example: '25.00'
        401:
          description: 'A valid access token is required.'
