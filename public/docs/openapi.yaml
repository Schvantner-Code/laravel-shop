openapi: 3.0.3
info:
  title: 'Laravel Shop API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: 'Admin Management'
    description: 'Endpoints for store administrators'
  - name: Authentication
    description: "\nAPIs for managing user registration and login."
  - name: 'Products & Categories (Public)'
    description: ''
  - name: 'User Orders'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "    You can retrieve a token from the registration or login endpoint. The token is returned as `data.access_token`.\n\n    The logout endpoint revokes only the token used for the current request and returns HTTP 204."
security:
  -
    default: []
paths:
  /api/v1/admin/orders:
    get:
      summary: 'List all orders'
      operationId: listAllOrders
      description: 'Filter by user, product, or date. Sort by price or date.'
      parameters:
        -
          in: query
          name: page
          description: 'The page number. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number. Must be at least 1.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Items per page (maximum 50). Must be between 1 and 50.'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Items per page (maximum 50). Must be between 1 and 50.'
            example: 20
        -
          in: query
          name: user_id
          description: 'Filter by customer ID. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter by customer ID. Must be at least 1.'
            example: 1
        -
          in: query
          name: product_id
          description: 'Filter by a product contained in the order. Must be at least 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter by a product contained in the order. Must be at least 1.'
            example: 1
        -
          in: query
          name: sort_by
          description: "Sort by 'total_price' or 'created_at'."
          example: created_at
          required: false
          schema:
            type: string
            description: "Sort by 'total_price' or 'created_at'."
            example: created_at
            enum:
              - total_price
              - created_at
        -
          in: query
          name: sort_dir
          description: "Sort direction: 'asc' or 'desc'."
          example: desc
          required: false
          schema:
            type: string
            description: "Sort direction: 'asc' or 'desc'."
            example: desc
            enum:
              - asc
              - desc
      responses:
        200:
          description: 'Orders retrieved for administration.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 1
                      status: Pending
                      status_code: pending
                      total_price: '25.00'
                      created_at: '2026-08-07T12:00:00+00:00'
                      items:
                        -
                          product_id: 1
                          name: Notebook
                          quantity: 2
                          unit_price: '12.50'
                          total: '25.00'
